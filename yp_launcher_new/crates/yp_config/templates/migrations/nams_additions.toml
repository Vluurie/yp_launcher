# Catch script errors and show a dialog instead of silently crashing.
validate_scripts = false

disable_content_features = false

# Skip starting the main Flutter overlay, the in-game mod UI that also
# hosts the YoRHa Protocol UI. Plugins and every NAMS feature still run;
# only the overlay and its panels, the YoRHa Protocol UI included, are
# gone, together with the memory they use. Requires restart.
disable_main_overlay = false

# Play the visual effects during an outfit hot-swap: the pod spawn-in
# blinder animation, the curtain, and the hacking-screen glitch filter.
# Set to false for an instant, effect-free swap. Live toggle.
outfit_swap_visual_effects = true

# Skip the startup splash window shown while the game loads. Setting this
# to true brings back the vanilla resize/flicker artifacts on startup.
disable_splash_screen = false

# Default-outfit boot mods: mods listed in nams/default_mods.toml
# are active from game start. Requires restart.
experimental_default_outfits = true

# Skip loading the 3DMigoto runtime from nams/thirdparty/3dmigoto/. Managed
# by the Third Party tab; set to true to stop loading it.
disable_3dmigoto_loading = false

# Skip loading ReShade from nams/thirdparty/reshade/. Managed by the Third
# Party tab; set to true to run without ReShade.
disable_reshade_loading = false

# Skip loading third-party game-offset mods from nams/thirdparty/game/.
# These are DLLs built for a stock NieRAutomata.exe; NAMS rewrites
# their imports so game.bin answers as the main module. Managed by
# the Third Party tab. Per-DLL tweaks: nams/thirdparty/game/game.toml
disable_game_mods_loading = false

# Skip loading Direct3D proxies from nams/thirdparty/graphic/: DLLs named
# like a system DLL (d3d11.dll, dxgi.dll, ...) that the game's calls
# have to pass through. Requires restart.
disable_graphic_mods_loading = false

# Show escalating hints when the "Loading Map" screen takes too long.
loading_stall_hints = true

# Fix the vanilla bug where wind animation stops after max playtime.
fix_wind_timer_bug = true

# Ignore the leftover developer hotkeys Shift+3/6/K/L, which force every
# render target to 1600x900 and break the look until you restart.
disable_debug_hotkeys = true

# Add the NAMS tab and the NAMS rows to the in-game options menu. Set
# to false to keep the vanilla options menu. Requires restart.
ingame_settings = true

# Master switch for the mouse and keyboard layer. When true, all mouse
# and keybind settings are ignored and the game keeps stock input. Live.
disable_input_features = false

# Skip the Platinum Games / Square Enix logo movies played while the
# game loads. Loading itself is untouched; the game already lets you
# skip them with a button press.
skip_startup_logos = false
