[package]
name = "yp_host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yp_core.workspace = true
yp_config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
ignore.workspace = true
gilrs.workspace = true
sha2.workspace = true
sha1.workspace = true
dirs.workspace = true
jiff.workspace = true
indexmap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
yp_core = { workspace = true, features = ["test-support"] }
