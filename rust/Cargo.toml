[package]
name = "yp_formats"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.11.1", default-features = false, features = ["anyhow", "dart-opaque", "log", "portable-atomic", "rust-async", "thread-pool", "user-utils", "backtrace"] }
image = { version = "0.25.10", default-features = false, features = ["dds", "png", "jpeg", "webp", "bmp", "tga"] }
texpresso = "2.0.2"
three-d = { version = "=0.19.0", default-features = false, features = ["window"] }
winit = "=0.28.7"

# arrayref only enters the graph on Linux/Wayland (winit -> sctk-adwaita -> tiny-skia), never in
# a Windows build. Pinned because 0.3.10 was published from a compromised maintainer account with
# a malicious build script and 0.3.5..0.3.9 were yanked to force that upgrade; this keeps
# `cargo update` off it. Drop once upstream is confirmed clean.
[target.'cfg(unix)'.dependencies]
arrayref = "=0.3.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
