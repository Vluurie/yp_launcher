name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - yp_launcher_new/**
      - LICENSE
      - .github/workflows/release.yml
  pull_request:
    paths:
      - yp_launcher_new/**
      - LICENSE
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: yp_launcher_new

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check version consistency
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "yp_app") | .version')
          echo "workspace version $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi

  test:
    name: test ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yp_launcher_new
      - name: install linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libx11-dev libudev-dev
      - name: install metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
      - name: test docs without library and tools
        run: cargo test -p yp_docs_ui --no-default-features --lib --locked

  package:
    name: package ${{ matrix.name }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    env:
      APP_NAME: YoRHa Protocol Launcher
      APP_ID: com.vluurie.yplauncher
      BINARY: YoRHa-Protocol-Launcher
      APPIMAGETOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_VERSION: "20251108"
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yp_launcher_new
      - name: install linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libx11-dev libudev-dev file patchelf
      - name: install metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: build
        run: cargo build --profile small --locked -p yp_app --features embedded-assets
      - name: read version
        run: echo "VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "yp_app") | .version')" >> "$GITHUB_ENV"
      - name: stage windows
        if: runner.os == 'Windows'
        run: |
          root="stage/$APP_NAME"
          mkdir -p "$root/assets" dist
          cp "target/small/$BINARY.exe" "$root/"
          cp -R assets/bins "$root/assets/"
          rm -f "$root/assets/bins/nams.dll"
          cp ../LICENSE "$root/LICENSE.txt"
      - name: stage linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/lib dist
          cp "target/small/$BINARY" "stage/$BINARY"
          patchelf --set-rpath '$ORIGIN/lib' "stage/$BINARY"
          ldd "target/small/$BINARY" \
            | awk '$1 ~ /^(libxkbcommon|libxcb-xkb)/ && $3 ~ /^\// { print $3 }' \
            | xargs -r cp -L -t stage/lib
          ls -l stage/lib
          test -f stage/lib/libxkbcommon-x11.so.0

          root="$BINARY-$VERSION-linux-x86_64"
          mkdir -p "stage/$root/assets"
          cp "stage/$BINARY" "stage/$root/"
          cp -R stage/lib "stage/$root/"
          cp -R assets/bins "stage/$root/assets/"
          rm -f "stage/$root/assets/bins/nams.dll"
          cp ../LICENSE "stage/$root/LICENSE.txt"

          appdir=stage/AppDir
          mkdir -p "$appdir/usr/bin/assets"
          cp "stage/$BINARY" "$appdir/usr/bin/"
          cp -R stage/lib "$appdir/usr/bin/"
          cp -R assets/bins "$appdir/usr/bin/assets/"
          rm -f "$appdir/usr/bin/assets/bins/nams.dll"
          cp ../LICENSE "$appdir/usr/bin/LICENSE.txt"
          cp assets/icon/app_icon.png "$appdir/yp-launcher.png"
          cat > "$appdir/yp-launcher.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$APP_NAME
          Exec=$BINARY
          Icon=yp-launcher
          Categories=Game;
          Terminal=false
          EOF
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          exec "$(dirname "$(readlink -f "$0")")/usr/bin/YoRHa-Protocol-Launcher" "$@"
          EOF
          chmod +x "$appdir/AppRun"
      - name: stage macos
        if: runner.os == 'macOS'
        run: |
          app="stage/$APP_NAME.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/assets" dist
          cp "target/small/$BINARY" "$app/Contents/MacOS/"
          cp -R assets/bins "$app/Contents/Resources/assets/"
          rm -f "$app/Contents/Resources/assets/bins/nams.dll"
          cp ../LICENSE "$app/Contents/Resources/LICENSE.txt"

          iconset=stage/AppIcon.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            double=$((size * 2))
            sips -z "$size" "$size" assets/icon/app_icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" assets/icon/app_icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          rm -rf "$iconset"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$APP_NAME</string>
            <key>CFBundleDisplayName</key><string>$APP_NAME</string>
            <key>CFBundleIdentifier</key><string>$APP_ID</string>
            <key>CFBundleExecutable</key><string>$BINARY</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
      - name: check no 7-zip or mrbc is staged
        run: |
          found=$(find stage \( -iname '7z*' -o -iname 'mrbc*' \) -print)
          if [ -n "$found" ]; then
            echo "must not ship:"
            echo "$found"
            exit 1
          fi
      - name: package windows zip
        if: runner.os == 'Windows'
        run: |
          cd stage
          7z a -tzip "../dist/$BINARY-$VERSION-windows-x86_64.zip" "$APP_NAME"
      - name: fetch vc_redist
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory vc_redist | Out-Null
          curl.exe -fL -o vc_redist\vc_redist.x64.exe https://download.visualstudio.microsoft.com/download/pr/9b0d1fa5-c16d-4ee8-97f0-c2734086ece8/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe
          if ((Get-FileHash vc_redist\vc_redist.x64.exe -Algorithm SHA256).Hash -ne 'CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B') { throw 'vc_redist checksum mismatch' }
      - name: fetch chinese isl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory isl | Out-Null
          curl.exe -fL -o isl\ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl
          if ((Get-FileHash isl\ChineseSimplified.isl -Algorithm SHA256).Hash -ne '7D544B9BB1D142CFA11F2E5D3CC8ABE2E55F8E066C5124E3772675AA236E1278') { throw 'ChineseSimplified.isl checksum mismatch' }
      - name: package windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\stage\$env:APP_NAME" "/DVCRedistDir=$PWD\vc_redist" "/DChineseIsl=$PWD\isl\ChineseSimplified.isl" "/O$PWD\dist" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: package linux
        if: runner.os == 'Linux'
        run: |
          root="$BINARY-$VERSION-linux-x86_64"
          tar -C stage -czf "dist/$root.tar.gz" "$root"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL -o appimage-runtime "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool "$APPIMAGE_RUNTIME_SHA256" appimage-runtime | sha256sum --check --strict
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --runtime-file appimage-runtime stage/AppDir "dist/$root.AppImage"
      - name: package macos
        if: runner.os == 'macOS'
        run: |
          app="stage/$APP_NAME.app"
          codesign --force --deep --sign - "$app"
          dmg="dist/$BINARY-$VERSION-macos-$(uname -m).dmg"
          for attempt in 1 2 3; do
            hdiutil create -volname "$APP_NAME" -srcfolder "$app" -ov -format UDZO "$dmg" && break
            sleep 5
          done
          test -f "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: YoRHa-Protocol-Launcher-${{ matrix.name }}
          path: yp_launcher_new/dist
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: YoRHa Protocol Launcher ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
